<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0} img{max-width:100%}</style>
<title>סימולטור שחפים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f6f8fb; --ink:#1c2b3a; --muted:#5f6d7c; --line:#dde3ea;
  --navy:#1d3b5c; --navy-2:#2a5480; --link:#1f5fa8; --chip:#e9f0fa; --chip-ink:#1f4f8a;
  --pink:#fbe9f0; --pink-ink:#b4245f; --red:#cf3a3f; --red-soft:#fdeced; --green:#2b9a52; --green-soft:#e5f5ea;
  --amber:#c98d00; --amber-soft:#fff4d8; --grey:#8b96a3; --info-soft:#e4ecf7; --focus:#2b7de9;
  --tr-bg:#1b1f2a; --tr-ink:#f4efe4; --tr-muted:#a9adb8; --tr-accent:#ffc247; --tr-card:#252a37; --tr-line:#363c4c;
  --radius:10px; --shadow:0 1px 2px rgba(20,35,55,.06),0 4px 14px rgba(20,35,55,.06);
  color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
svg{width:18px;height:18px;flex:none}
html,body{background:var(--bg)}
body{font-family:"Assistant","Arial Hebrew",Arial,sans-serif;font-size:15px;color:var(--ink);line-height:1.5;direction:rtl;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--link);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)}
.sm{font-size:13px}
.tnum{font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin-inline:auto;padding-inline:16px}
.app-shell{transition:margin .2s ease}

/* ---------- trainer strip ---------- */
.tr-strip{background:var(--tr-bg);color:var(--tr-ink);font-family:"Rubik","Assistant",sans-serif;font-size:13.5px}
.tr-strip .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:7px}
.tr-tag{background:var(--tr-accent);color:var(--tr-bg);font-weight:700;border-radius:4px;padding:1px 8px;letter-spacing:.02em}
.tr-note{color:var(--tr-muted)}
.tr-sp{flex:1}
.tr-btn{background:transparent;border:1px solid var(--tr-line);color:var(--tr-ink);border-radius:999px;padding:4px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tr-btn:hover{border-color:var(--tr-accent)}
.tr-btn[aria-pressed="true"]{background:var(--tr-accent);color:var(--tr-bg);border-color:var(--tr-accent);font-weight:600}
.tr-btn .badge{background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;font-weight:700}
.tr-btn svg{width:15px;height:15px}

/* ---------- header ---------- */
.hdr{background:var(--surface);box-shadow:0 1px 0 var(--line)}
.hdr-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-top:14px;flex-wrap:wrap}
.brand{display:flex;gap:12px;align-items:center}
.brand svg{width:46px;height:46px;flex:none}
.brand-sub{font-size:12.5px;color:var(--muted)}
.brand-main{font-size:24px;font-weight:700;line-height:1.15;color:var(--navy)}
.brand-main .sep{color:var(--grey);font-weight:400;margin-inline:4px}
.hdr-user{display:flex;flex-direction:column;align-items:flex-end;gap:8px;font-size:13.5px}
.pill{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--navy)}
.pill:hover{border-color:var(--navy-2)}
.pill svg{width:15px;height:15px}
.nav{display:flex;gap:4px;overflow-x:auto;margin-top:8px;scrollbar-width:thin}
.nav a{padding:10px 14px;color:var(--navy);white-space:nowrap;border-bottom:3px solid transparent;font-weight:600}
.nav a:hover{text-decoration:none;background:var(--surface-2)}
.nav a.on{border-bottom-color:var(--navy-2);color:var(--navy-2)}
.nav svg{width:16px;height:16px;vertical-align:-2px}
.main{padding-block:20px 24px}
.credit{padding-block:14px 110px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);text-align:center;user-select:text}

/* ---------- generic ---------- */
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:18px}
.card h3{margin:0 0 12px;font-size:17px;color:var(--navy);font-weight:700;display:flex;align-items:center;gap:6px}
.card h3 svg{width:15px;height:15px;color:var(--grey)}
.pg-title{font-size:20px;color:var(--navy);margin:4px 0 14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.btn{border:1.5px solid var(--navy-2);background:var(--surface);color:var(--navy-2);border-radius:999px;padding:6px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--chip)}
.btn svg{width:15px;height:15px}
.btn-p{background:var(--link);border-color:var(--link);color:#fff}
.btn-p:hover{background:var(--navy-2)}
.btn-red{border-color:var(--red);color:var(--red)}
.btn-red:hover{background:var(--red-soft)}
.btn-ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.lnk{background:none;border:0;color:var(--link);cursor:pointer;padding:0;display:inline-flex;gap:5px;align-items:center;font-weight:600}
.lnk svg{width:15px;height:15px}
.lnk:hover{text-decoration:underline}
.icon-btn{background:none;border:0;cursor:pointer;color:var(--link);padding:4px;border-radius:6px;display:inline-flex}
.icon-btn:hover{background:var(--chip)}
.icon-btn svg{width:19px;height:19px}
.icon-btn[disabled]{color:var(--grey);cursor:not-allowed;background:none}
.chip{border:0;border-radius:999px;padding:4px 12px;background:var(--chip);color:var(--chip-ink);display:inline-flex;align-items:center;gap:6px;font-size:13.5px;cursor:pointer;font-weight:600}
.chip svg{width:14px;height:14px}
.chip:hover{filter:brightness(.96)}
.chip.dis{opacity:.42;cursor:help}
.chip-red{background:var(--surface);border:1.5px solid var(--red);color:var(--red)}
.chip-pink{background:var(--pink);color:var(--pink-ink)}
.note{border-inline-start:4px solid var(--navy-2);background:var(--info-soft);padding:9px 14px;border-radius:4px;display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;font-size:14px}
.note svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--navy-2)}
.note.warn{border-color:var(--amber);background:var(--amber-soft)}
.note.warn svg{color:var(--amber)}
.note.ok{border-color:var(--green);background:var(--green-soft)}
.note.ok svg{color:var(--green)}
.note.bad{border-color:var(--red);background:var(--red-soft)}
.note.bad svg{color:var(--red)}
.empty{padding:22px;text-align:center;color:var(--muted)}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;border-radius:6px}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
table.t th{background:var(--navy);color:#fff;font-weight:600;padding:10px 12px;text-align:right;white-space:nowrap}
table.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:hover td{background:#fafbfd}
table.t td.acts{white-space:nowrap}
table.t tr.sub td{background:var(--surface-2);font-size:13.5px}
.nm{display:flex;align-items:center;gap:8px;white-space:nowrap}
.avatar{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--grey);display:inline-flex;align-items:center;justify-content:center;color:var(--grey);flex:none;position:relative}
.avatar svg{width:16px;height:16px}
.avatar .af{position:absolute;bottom:-4px;left:-6px;width:14px;height:14px;color:var(--red);display:flex}
.avatar .af svg{width:14px;height:14px}
.chev{background:none;border:0;cursor:pointer;color:var(--ink);padding:2px;display:inline-flex}
.chev svg{width:16px;height:16px;transition:transform .15s}
.chev.open svg{transform:rotate(-90deg)}
.act{width:30px;height:30px;border-radius:50%;border:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;margin-inline:2px}
.act svg{width:16px;height:16px}
.act.f{background:var(--red-soft);color:var(--red)}
.act.q{background:var(--pink);color:var(--pink-ink)}
.act.c{background:var(--chip);color:var(--chip-ink)}
.act:hover{filter:brightness(.93)}

/* ---------- status ---------- */
.st{display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.st svg{width:18px;height:18px}
.st-active{color:var(--green)} .st-pending{color:var(--amber)} .st-suspended{color:var(--red)} .st-limited{color:var(--grey)} .st-empty{color:var(--muted);font-weight:400}
.st-pending span,.st-suspended span,.st-limited span,.st-active span{color:var(--ink)}
.tag{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.tag.ok{background:var(--green-soft);border-color:#bfe3cb;color:#1d6e3a}
.tag.wait{background:var(--amber-soft);border-color:#f0dca0;color:#7a5800}
.tag.bad{background:var(--red-soft);border-color:#f3c3c5;color:#9a2328}
.tag.dim{color:var(--muted)}
.flag{color:var(--red);display:inline-flex}
.flag svg{width:17px;height:17px}

/* ---------- home ---------- */
.cards3{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:18px;margin-bottom:6px}
@media (max-width:980px){.cards3{grid-template-columns:1fr}}
.donut{display:flex;justify-content:center;padding:6px 0}
.donut-in{position:relative;width:170px;height:170px}
.donut-in svg{width:100%;height:100%}
.donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-c b{font-size:30px;color:var(--navy);line-height:1}
.donut-c span{font-size:13px;color:var(--muted)}
.act-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.trophy{background:var(--info-soft);border-radius:6px;padding:4px 10px;font-size:12.5px;color:var(--navy)}
.emerg-count{display:inline-flex;gap:6px;align-items:center;font-size:13px;margin-top:-6px}
.emerg-count svg{width:15px;height:15px;color:var(--red)}
.bars{display:flex;gap:6px;align-items:flex-end;justify-content:space-around;height:200px;margin-top:10px;padding-top:18px}
.bar{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:0;height:100%}
.bar .num{font-size:12.5px;font-weight:700}
.bar .col{width:12px;flex:1;border-radius:6px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.bar .col i{display:block;width:100%;border-radius:6px}
.bar .lbl{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.15;height:28px}
.intern li{display:flex;align-items:center;gap:10px;padding:7px 0}
.intern ul{list-style:none;margin:0;padding:0}
.intern b{font-size:16px;min-width:20px}
.intern .ic{width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;color:var(--navy-2)}
.intern .ic svg{width:15px;height:15px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 0;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 16px;cursor:pointer;color:var(--navy);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;font-size:15px}
.tabs button.on{border-bottom-color:var(--navy);color:var(--navy)}
.tabs button:not(.on){color:var(--muted)}
.tabs + .card{border-top-left-radius:0;border-top-right-radius:0;margin-top:0}
.tabs .cnt{font-weight:400;margin-inline-start:4px}
.tabs .warnic svg{width:14px;height:14px;color:var(--amber);vertical-align:-2px}

/* ---------- search ---------- */
.search-bar{background:var(--info-soft);border-radius:8px;padding:12px 16px;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.search-bar .fld{min-width:150px;flex:1}
.search-bar .chk{padding-bottom:7px}
.res-count{font-size:13px;color:var(--muted);margin:12px 2px 8px}

/* ---------- forms ---------- */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px 18px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld label,.flabel{font-size:13.5px;font-weight:600;color:var(--ink)}
.req{color:var(--red);font-weight:700;margin-inline-start:2px}
.fld input[type=text],.fld input[type=date],.fld input[type=time],.fld input[type=tel],.fld input[type=email],.fld select,.fld textarea,.inp{border:1px solid #c9d2dd;border-radius:6px;padding:7px 10px;background:var(--surface);width:100%;min-width:0}
.fld textarea{resize:vertical;min-height:70px}
.fld input:disabled,.fld select:disabled,.fld textarea:disabled{background:var(--surface-2);color:var(--muted)}
.fld.err input,.fld.err select,.fld.err textarea,.fld.err .opts{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.fld .hint{font-size:12.5px;color:var(--muted)}
.fld.err .hint.e{color:var(--red)}
.opts{display:flex;flex-direction:column;gap:6px;border:1px solid transparent;border-radius:6px;padding:2px}
.opts.inline{flex-direction:row;flex-wrap:wrap;gap:6px 18px}
.chk{display:inline-flex;gap:7px;align-items:center;cursor:pointer;font-size:14px}
.chk input{width:16px;height:16px;accent-color:var(--link)}
.sub-opt{margin-inline-start:24px;padding:6px 10px;border-inline-start:2px solid var(--line);display:flex;flex-direction:column;gap:6px}
.sec-t{font-size:15px;font-weight:700;color:var(--navy);margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.sec-t:first-child{margin-top:0}
hr.sep{border:0;border-top:1px solid var(--line);margin:16px 0}
.ro{background:var(--surface-2);border-radius:6px;padding:7px 10px;color:var(--muted);min-height:38px}
.strip{background:var(--surface-2);border-radius:6px;padding:8px 12px;font-size:13.5px;display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px}
.recip{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;position:relative;background:var(--surface)}
.recip .x{position:absolute;top:6px;left:6px}
.recip-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px 12px}

/* ---------- sheet ---------- */
.sheet-hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sheet-hd h2{margin:0;font-size:19px;color:var(--navy)}
.back{background:none;border:0;cursor:pointer;color:var(--link);display:inline-flex;padding:4px}
.back svg{width:20px;height:20px}
.pcard{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:start}
@media (max-width:760px){.pcard{grid-template-columns:1fr}}
.pc-id{background:var(--info-soft);border-radius:8px;padding:14px;display:flex;gap:12px;align-items:center}
.pc-id b{font-size:18px;display:block;color:var(--navy)}
.pc-id .avatar{width:40px;height:40px}
.pc-details h4{margin:0 0 8px;font-size:15px;color:var(--navy)}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px 14px;margin:0}
.dl dt{font-size:12.5px;font-weight:700}
.dl dd{margin:0;font-size:14px;color:var(--muted)}
.pc-links{grid-column:1/-1;display:flex;gap:18px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.addint{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.addint>span{font-weight:600;font-size:14px}

/* ---------- intervention page ---------- */
.ihead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ihead .kic{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:none}
.ihead .kic svg{width:20px;height:20px}
.ihead h2{margin:0;font-size:19px;color:var(--navy)}
.locked-note{display:flex;gap:8px;align-items:center}
.mtable td{cursor:default}
.meet-ed{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:14px;margin:8px 0 14px}
.tasklist{list-style:none;margin:0;padding:0}
.tasklist li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.tasklist li.done span{text-decoration:line-through;color:var(--muted)}
.chkbtn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--green);background:var(--surface);color:var(--green);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
.chkbtn svg{width:15px;height:15px}
.chkbtn:hover{background:var(--green-soft)}

/* ---------- diary ---------- */
.week{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:8px;min-width:780px}
.day{background:var(--surface-2);border-radius:8px;padding:8px;min-height:240px}
.day h5{margin:0 0 8px;font-size:13.5px;color:var(--navy)}
.day.today{outline:2px solid var(--navy-2)}
.ev{display:block;border-radius:6px;padding:6px 8px;margin-bottom:6px;font-size:12.5px;color:#fff;cursor:pointer;line-height:1.3;border:0;width:100%;text-align:right}

/* ---------- modal ---------- */
.ovl{position:fixed;inset:0;background:rgba(18,28,42,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto;z-index:50}
.dlg{background:var(--surface);border-radius:10px;width:min(920px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25);padding:18px 22px 20px;margin-bottom:6vh}
.dlg.md{width:min(680px,100%)}
.dlg.sm{width:min(500px,100%)}
.dlg-h{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--navy-2);padding-bottom:10px;margin-bottom:14px}
.dlg-h h2{margin:0;font-size:19px;color:var(--navy);flex:1}
.dlg-f{display:flex;gap:10px;justify-content:flex-start;margin-top:18px;border-top:1px solid var(--line);padding-top:14px;flex-wrap:wrap}
#coach-root .ovl{z-index:70;align-items:center}
.coach{border-top:5px solid var(--tr-accent)}
.coach .who{font-family:"Rubik",sans-serif;font-size:12px;font-weight:600;color:#7a5a00;background:var(--amber-soft);display:inline-block;border-radius:4px;padding:1px 8px;margin-bottom:8px}
.coach h2{margin:0 0 8px;font-size:19px;color:var(--navy)}
.coach .body{font-size:15px}
.coach .body p{margin:0 0 10px}
.hl{background:#ffe08a;border-radius:3px;padding:0 2px}

/* toast */
#toast-root{position:fixed;bottom:18px;right:50%;transform:translateX(50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(560px,92vw)}
.toast{background:var(--navy);color:#fff;border-radius:8px;padding:10px 16px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:14.5px;animation:tin .25s ease}
.toast.ok{background:#1f7a43}
.toast.tr{background:var(--tr-bg);color:var(--tr-ink);border:1px solid var(--tr-accent);font-family:"Rubik",sans-serif}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- trainer drawer ---------- */
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(380px,94vw);background:var(--tr-bg);color:var(--tr-ink);z-index:55;transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;font-family:"Rubik","Assistant",sans-serif;box-shadow:6px 0 30px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
@media (min-width:1180px){body.dopen .app-shell{margin-left:380px}body.dopen .ovl{left:380px}body.dopen .hs-card{left:calc(50% + 190px)}}
.dr-h{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.dr-h h2{margin:0;font-size:17px;flex:1;color:var(--tr-accent);font-weight:700}
.dr-x{background:none;border:0;color:var(--tr-ink);cursor:pointer;padding:4px;display:inline-flex}
.dr-x svg{width:20px;height:20px}
.dr-tabs{display:flex;gap:4px;padding:0 12px;border-bottom:1px solid var(--tr-line)}
.dr-tabs button{background:none;border:0;color:var(--tr-muted);padding:8px 10px;cursor:pointer;border-bottom:2px solid transparent;font-weight:500}
.dr-tabs button.on{color:var(--tr-ink);border-bottom-color:var(--tr-accent)}
.dr-body{flex:1;overflow-y:auto;padding:14px 16px 30px;font-size:14px}
.dr-body p{margin:0 0 10px}
.mcard{background:var(--tr-card);border:1px solid var(--tr-line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.mcard h4{margin:0 0 4px;font-size:15px;display:flex;gap:8px;align-items:center}
.mcard .meta{font-size:12px;color:var(--tr-muted)}
.mcard.active{border-color:var(--tr-accent)}
.mcard.done h4::after{content:"✓ הושלמה";font-size:11.5px;color:#7fd39b;font-weight:500;margin-inline-start:auto}
.trb{background:var(--tr-accent);color:var(--tr-bg);border:0;border-radius:999px;padding:5px 14px;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px}
.trb.ghost{background:transparent;color:var(--tr-ink);border:1px solid var(--tr-line);font-weight:500}
.trb:hover{filter:brightness(1.05)}
.story{background:#2d3343;border-radius:8px;padding:10px 12px;margin:8px 0 12px;font-size:13.5px;line-height:1.55;border-inline-start:3px solid var(--tr-accent)}
.story q{font-style:italic}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps li{display:flex;gap:10px;padding:7px 4px;border-radius:6px;align-items:flex-start;font-size:13.8px;line-height:1.45}
.steps li .dot{width:20px;height:20px;border-radius:50%;flex:none;border:1.5px solid var(--tr-line);display:inline-flex;align-items:center;justify-content:center;font-size:11px;margin-top:1px}
.steps li.done{color:var(--tr-muted)}
.steps li.done .dot{background:#2b9a52;border-color:#2b9a52;color:#fff}
.steps li.cur{background:#2f3546}
.steps li.cur .dot{border-color:var(--tr-accent);color:var(--tr-accent)}
.steps li.skip .dot{background:#6a6f7c;border-color:#6a6f7c;color:#fff}
.hintbox{background:#33291a;border:1px dashed var(--tr-accent);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:13px;color:#ffe3a3}
.qz{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.qz button{background:#2f3546;border:1px solid var(--tr-line);color:var(--tr-ink);border-radius:8px;padding:7px 10px;text-align:right;cursor:pointer;font-family:inherit;font-size:13.5px}
.qz button:hover{border-color:var(--tr-accent)}
.qz button.right{background:#1f5a35;border-color:#2b9a52}
.qz button.wrong{background:#5a2326;border-color:#a33}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat3 div{background:var(--tr-card);border-radius:8px;padding:10px;text-align:center}
.stat3 b{display:block;font-size:22px;color:var(--tr-accent)}
.stat3 span{font-size:11.5px;color:var(--tr-muted)}
.sins{margin:0;padding-inline-start:18px;font-size:13px;color:#f3c3a5}
.sw{display:flex;align-items:center;gap:10px;background:var(--tr-card);border-radius:8px;padding:10px 12px;margin-bottom:12px;cursor:pointer;border:1px solid var(--tr-line);width:100%;color:var(--tr-ink);font-family:inherit;font-size:14px;text-align:right}
.sw i{width:38px;height:22px;border-radius:999px;background:#444b5d;position:relative;flex:none;transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:right .2s}
.sw[aria-pressed="true"] i{background:var(--tr-accent)}
.sw[aria-pressed="true"] i::after{right:19px}
.prog{height:6px;border-radius:999px;background:#3a4052;overflow:hidden;margin:6px 0}
.prog i{display:block;height:100%;background:var(--tr-accent)}

#hs-layer{position:fixed;inset:0;pointer-events:none;z-index:60}
.hs-dot{position:absolute;pointer-events:auto;width:26px;height:26px;border-radius:50%;background:var(--tr-accent);color:var(--tr-bg);font:700 12.5px "Rubik",sans-serif;border:2px solid var(--tr-bg);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 0 rgba(255,194,71,.6);animation:pulse 1.8s infinite}
.hs-dot.found{background:#2b9a52;color:#fff;animation:none;border-color:#fff}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,194,71,.65)}70%{box-shadow:0 0 0 12px rgba(255,194,71,0)}100%{box-shadow:0 0 0 0 rgba(255,194,71,0)}}

.hs-card .row{margin-top:12px}
.quiz-item{background:var(--tr-card);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.quiz-item .qt{font-size:13.8px;margin-bottom:6px}
.quiz-item select{width:100%;background:#1b1f2a;color:var(--tr-ink);border:1px solid var(--tr-line);border-radius:6px;padding:6px}
.quiz-item.right{outline:2px solid #2b9a52}
.quiz-item.wrong{outline:2px solid #c0393e}
.quiz-item .fx{font-size:12.5px;margin-top:6px;color:var(--tr-muted)}

.phone{position:fixed;bottom:16px;left:16px;width:330px;max-width:calc(100vw - 32px);height:min(600px,calc(100vh - 40px));background:#0f1218;border-radius:34px;padding:12px;z-index:56;box-shadow:0 20px 60px rgba(0,0,0,.4);display:flex;flex-direction:column;transition:left .2s}

function consentState(c) {

  ended: [`הסתיימה`, 'dim'], expired: [`פג תוקף`, 'bad']

function activeTypes(sid) {

}

  if (cs.some((c, i) => c.oral && st[i] === 'signed')) return 'limited';
  if (cs.some((c, i) => !c.oral && (st[i] === 'ended' || st[i] === 'expired'))) return 'suspended';

  return `<div class="sheet-hd"><button class="back" data-a="back" aria-label="חזרה">${I.arrowR}</button><h2>גיליון תלמיד | ${esc(fullName(s))}</h2><span data-hs="sheet.status">${statusBadge(id)}</span><span class="sp"></span><button class="icon-btn" data-a="openModal" data-m="sheetSearch" data-id="${id}" aria-label="חיפוש בגיליון" data-hs="sheet.search">${I.search}</button></div>

/* ---------------- intervention ---------------- */
function vIntv(id) {
  const i = intv(id); if (!i) return `<div class="card empty">ההתערבות לא נמצאה.</div>`;

  const s = i.studentId ? stu(i.studentId) : null, sy = i.systemId ? sysOf(i.systemId) : null, K = KIND[i.kind];

  const st = intvStatus(i);
  const foreign = i.psych !== ME;
  const tabsDef = K.series ? [['details', `פרטי הסדרה`], ['meetings', `מפגשים (${i.meetings.length})`], ['summary', `תיעוד וסיכום סדרה`], ['docs', `מסמכים`], ['tasks', `משימות`]] : [['details', i.kind === 'emergency' ? `פרטי פגישה וסיכום` : `פרטי פגישה וסיכום`], ['docs', `מסמכים`], ['tasks', `משימות`]];
  if (i.systemId) tabsDef.splice(tabsDef.findIndex(t => t[0] === 'docs'), 1);
  const tab = S.ui.intvTab || 'details';
  const panel = (k, html) => `<div data-panel="${k}" ${tab === k ? '' : 'hidden'}>${html}</div>`;
  let body;
  if (K.series) body = panel('details', seriesDetails(i)) + panel('meetings', seriesMeetings(i)) + panel('summary', seriesSummary(i));
  else body = panel('details', singleForm(i));
  if (!i.systemId) body += panel('docs', intvDocs(i));
  body += panel('tasks', intvTasks(i));
  const locked = st === `בוצע` && !i.systemId;
  const actions = foreign ? '' : K.series ? '' : i.systemId ? `<button class="btn btn-p" data-a="saveSingle" data-id="${i.id}">${I.save} שמירה</button>`
    : locked ? `<span class="tag ok">המפגש נסגר</span>` : `<button class="btn" data-a="saveSingle" data-id="${i.id}">${I.save} שמירה</button><button class="btn btn-p" data-a="closeSingle" data-id="${i.id}">${I.lock} ${i.kind === 'emergency' ? 'סגירת חרום' : 'סגירת מפגש'}</button>${i.kind === 'individual' ? `<button class="btn btn-ghost" data-a="dupMeeting" data-id="${i.id}">${I.copy} שכפול מפגש</button>` : ''}`;
  const lockedAfterClose = st === `בוצע` && i.kind === 'individual' ? `<button class="btn btn-ghost" data-a="dupMeeting" data-id="${i.id}">${I.copy} שכפול מפגש</button>` : '';
  return `<div class="row" style="margin-bottom:8px">${back}</div>
    <div class="ihead"><span class="kic" style="background:${K.color}">${I[K.icon]}</span><h2>${K.label}</h2>${statusTag(st)}${(i.kind === 'emergency' || i.meetings.some(m => m.emergency)) ? `<span class="flag">${I.flagF}</span>` : ''}<span class="sp"></span>${actions}${locked ? lockedAfterClose : ''}</div>
    ${consentBanner(i)}
    ${foreign ? `<div class="note">${I.eye}<div>ההתערבות הזאת שייכת ל${esc(psychName(i.psych))}. את/ה רואה שהיא קיימת${i.kind === 'therapy' ? `, אבל סיכומי המפגשים של פסיכותרפיה חסויים: רק המטפל/ת, המדריך/ה ומנהל/ת השפ"ח רואים אותם` : ''}. עריכה אפשרית רק למטפל/ת.</div></div>` : ''}
    ${locked && !K.series ? `<div class="note ok">${I.lock}<div>המפגש נסגר (סטטוס "בוצע"). החוק לא מאפשר לתקן רשומות לאחור, ורק למנהל/ת השפ"ח יש הרשאה לערוך התערבות סגורה.</div></div>` : ''}
    <div class="tabs" role="tablist">${tabsDef.map(([k, l]) => `<button class="${tab === k ? 'on' : ''}" data-a="intvTab" data-t="${k}">${l}</button>`).join('')}</div>

function consentBanner(i) {
  if (!i.studentId || i.kind === 'emergency') return '';

  if (c.oral) return `<div class="note warn">${I.warn}<div>מתועד תחת <b>הסכמה זמנית בעל פה</b> (בתוקף עד ${fmt(addDays(c.createdAt, 14))}, עד 2 מפגשים, רק במסגרת החינוכית).</div></div>`;
  if (i.kind === 'individual' && c.direct === false) return `<div class="note warn">${I.warn}<div>ההורים חתמו על התערבות פרטנית במערכת <b>ללא מפגש ישיר</b> עם התלמיד/ה. המערכת לא תחסום אתכם, אבל אתם אחראים לבחור פעולות שמתאימות להסכמה.</div></div>`;
  if (i.kind === 'individual' && c.direct) return `<div class="note">${I.info}<div>ההורים חתמו על התערבות פרטנית במערכת <b>כולל מפגש ישיר</b> עם התלמיד/ה.</div></div>`;
  return '';
}

}
function emergencyFields(i, d, dis) {

    ${F(`האם עודכנו ההורים?`, 'parentsInformed', {type: 'select', list: [`כן`, `לא`, `נעשה ניסיון, ללא מענה`], val: dv(d, 'parentsInformed'), req: true, dis, dep: 'eventType:חשד לאובדנות'})}
    ${F(`גורמים נוספים שעודכנו`, 'informed', {val: dv(d, 'informed'), dis, dep: 'eventType:חשד לאובדנות', ph: `יועצת, מנהלת, מחנכת…`})}</div>`;

function singleForm(i) {

      ${F(`סיבה לאי-צירוף הסכמה מדעת`, 'noConsentReason', {type: 'textarea', val: dv(d, 'noConsentReason'), req: true, dis, dep: 'attach:no', wide: true, rows: 2, ph: `למשל: אמירה אובדנית, ההורים לא זמינים`})}

function vDiary() {
  const off = S.ui.diaryWeek || 0;
  const t = new Date(TODAY + 'T12:00:00');
  const start = addDays(TODAY, -t.getDay() + off * 7);
  const days = [0, 1, 2, 3, 4, 5].map(n => addDays(start, n));
  const names = [`ראשון`, `שני`, `שלישי`, `רביעי`, `חמישי`, `שישי`];
  const q = (S.ui.diaryQ || '').trim();
  const evs = [];
  S.interventions.filter(i => i.psych === ME).forEach(i => i.meetings.forEach(m => {
    if (!m.from || !m.date) return;

      actions: [{label: `חזרה לעריכה`}, {label: `שמירה בכל זאת`, cls: 'btn-ghost', fn: () => { p.override = true; Trainer.sin(`פנייה עם מידע רגיש (${words.join(', ')}) לפני הסכמה מדעת`); A.saveInquiry(); }}]});

  }
  const wasEmpty = sheetStatus(s.id) === 'empty';
  const q = {id: uid('q'), studentId: s.id, date: TODAY, callerRel: f.callerRel, callerName: f.callerName, callerPhone: f.callerPhone, method: f.method, by: ME, subject: f.subject, desc: f.desc, assignees: f.assignees, status: f.status};
  S.inquiries.push(q);
  closeModal(); render();
  toast(wasEmpty ? `הפנייה נשמרה. נוצר גליון בסטטוס "מוגבל".` : `הפנייה נשמרה.`, 'ok');
  emit('inquiry.saved', {sid: s.id, q, sensitive: words.length > 0, override: !!p.override});
};

function stashConsent() { const root = modalRoot(), p = S.ui.modal.props; p.recips = readRecips(root, p.recips); p.d = readForm(root); }
A.consentAddRecip = () => { stashConsent(); S.ui.modal.props.recips.push({rel: '', name: '', method: 'portal'}); renderModal(); };
A.consentRemoveRecip = el => { stashConsent(); S.ui.modal.props.recips.splice(+el.dataset.k, 1); renderModal(); };
A.consentCopyEarly = () => toast(`הקישור נוצר רק אחרי "אישור". אחר כך מעתיקים אותו מלשונית "אישורים" בגליון.`);
A.saveConsent = () => {
  const root = modalRoot(), p = S.ui.modal.props, s = stu(p.id);
  if (!validate(root)) return;
  const f = readForm(root), recips = readRecips(root, p.recips);
  p.recips = recips; p.d = f;
  const types = f.types || [];
  if (f.oral && (types.length !== 1 || types[0] !== 'individual')) {
    coach({title: `הסכמה בעל פה לא מתאימה לכאן`, body: `<p>הסכמה זמנית בעל פה תקפה <b>רק</b> להתערבות פרטנית במערכת. לא לפסיכותרפיה, לא לאבחון ולא לשום דבר אחר.</p><p>השאירו רק "התערבות פרטנית במערכת", או בטלו את הסימון של בעל פה.</p>`});
    emit('consent.invalid', {why: 'oral'}); return;
  }
  if (!f.oral) {
    const bad = recips.findIndex(r => r.method === 'portal' && !r.phone && !r.email);
    if (bad > -1) {
      validate(root, [`phone_${bad}`, `email_${bad}`]);
      coach({title: `חסר פרט התקשרות`, body: `<p>ל<b>${esc(recips[bad].name || 'נמען')}</b> אין טלפון ואין דוא"ל, אז לאן הפורטל ישלח את הקישור?</p><p>הוסיפו לפחות פרט התקשרות אחד. (או הסירו את הנמען, אם באמת לא צריך את חתימתו. זו החלטה מקצועית שלכם.)</p>`});
      emit('consent.invalid', {why: 'contact'}); return;
    }
  }
  const c = {id: uid('c'), studentId: s.id, types, direct: types.includes('individual') ? f.direct === 'yes' : null, suicide: types.includes('diag') && !!f.suicide, oral: !!f.oral, psych: f.psych || ME, createdAt: TODAY, closedTypes: [], status: 'active',
    recipients: recips.map(r => {
      const signedNow = !!f.oral || r.method === 'upload';
      return {id: uid('r'), rel: r.rel, name: r.name, idnum: r.idnum, phone: r.phone, email: r.email, method: f.oral ? 'oral' : r.method, fileName: r.file, signed: signedNow, signedAt: signedNow ? TODAY : null, delivered: !r.ignoresFirst};
    })};
  S.consents.push(c);
  let portal = 0;
  c.recipients.forEach(r => {
    if (r.method === 'portal') { portal++; S.phone.push({id: uid('p'), consentId: c.id, recipientId: r.id, to: r.name, kind: 'link', date: TODAY, delivered: r.delivered}); }
    if (r.method === 'upload') S.docs.push({id: uid('d'), studentId: s.id, name: r.fileName || `טופס הסכמה סרוק`, type: `הסכמה מדעת סרוקה`, date: TODAY, by: ME});
  });
  closeModal(); S.ui.sheetTab = 'appr';
  if (S.ui.route !== 'student' || S.ui.params.id !== s.id) go('student', {id: s.id}); else render();
  const st = consentState(c);
  toast(st === 'signed' ? (c.oral ? `הסכמה בעל פה נרשמה. הגליון "מוגבל" ומאפשר התערבות פרטנית במערכת.` : `ההסכמה נקלטה. הגליון פעיל.`) : `ההסכמה נשלחה לחתימה. סטטוס הגליון: בהמתנה.`, 'ok');
  if (portal) setTimeout(() => toast(`הודעה חדשה בטלפון ההורה (כפתור "טלפון ההורה" למעלה)`, 'tr'), 600);
  emit('consent.sent', {sid: s.id, c});
  if (st === 'signed') emit('consent.complete', {sid: s.id, c});
};
function deliver(c, kind) {
  let n = 0;
  c.recipients.filter(r => !r.signed && r.method === 'portal').forEach(r => {
    r.delivered = true; n++;
    S.phone.push({id: uid('p'), consentId: c.id, recipientId: r.id, to: r.name, kind, date: TODAY, delivered: true});
  });
  return n;
}
A.remind = el => {

  emit('reminder.sent', {c});
};

    const layer = $('#hs-layer'); if (!layer || !S.progress.exploreOn) return;
    $$('.hs-dot', layer).forEach(dot => {
      const id = dot.dataset.hsId;
      const el = $$(`[data-hs="${id}"]`).find(e => e.getClientRects().length && !e.closest('[hidden]'));
      if (!el) { dot.hidden = true; return; }
      const r = el.getBoundingClientRect();
      if (r.bottom < 0 || r.top > innerHeight) { dot.hidden = true; return; }
      dot.hidden = false;
      dot.style.top = Math.max(2, r.top - 10) + 'px';
      dot.style.left = Math.max(2, Math.min(innerWidth - 30, r.right - 14)) + 'px';

  },
  open(id) {
    S.ui.hs = {id, picked: null, wrong: []};

  renderCard() {

    box.hidden = false;
    if (st.summary) return this.renderSummary();
    const h = HS[st.id], ids = this.ids(h.scr), n = ids.indexOf(st.id) + 1;
    const solved = st.picked === 0;
    box.innerHTML = `<div class="scr">${SCREENS[h.scr].label} · נקודה ${n} מתוך ${ids.length}</div><h3>מה אני? ${esc(h.q)}</h3>
      <div class="qz">${shuffled(h.o, st.id).map(({x, i}) => `<button class="${solved && i === 0 ? 'right' : st.wrong.includes(i) ? 'wrong' : ''}" data-a="hsPick" data-i="${i}" ${solved ? 'disabled' : ''}>${esc(x)}</button>`).join('')}</div>
      ${st.wrong.length && !solved ? `<div class="sm" style="margin-top:8px;color:#f3c3a5">לא בדיוק. נסו שוב.</div>` : ''}
      ${solved && h.ex ? `<div class="ex">${esc(h.ex)}</div>` : ''}
      <div class="row">${solved ? `<button class="trb" data-a="hsNext">לנקודה הבאה</button>` : ''}<button class="trb ghost" data-a="hsClose">סגירה</button><span class="sp"></span><span class="sm" style="color:var(--tr-muted)">${ids.filter(x => S.progress.found[x]).length}/${ids.length} נמצאו</span></div>`;

  next() {
    const scr = HS[S.ui.hs.id].scr, ids = this.ids(scr);

    else { S.ui.hs = null; this.renderCard(); toast(ids.every(id => S.progress.found[id]) ? `מצאתם את כל הנקודות במסך הזה! נסו את תרגיל הסיכום בחלונית "סיור".` : `אין עוד נקודות גלויות כאן. חלק מהנקודות מופיעות רק בלשונית אחרת או בתוך חלון.`, 'tr'); }
  },
  openSummary(scr) { S.ui.hs = {summary: scr, ans: {}, checked: false}; this.renderCard(); },
  renderSummary() {
    const st = S.ui.hs, Q = SUMMARY[st.summary], box = $('#hs-card');
    box.innerHTML = `<div class="scr">תרגיל סיכום · ${SCREENS[st.summary].label}</div><h3>${esc(Q.title)}</h3>
      ${Q.items.map((it, k) => {
        const v = st.ans[k], ok = st.checked ? +v === it.a : null;
        return `<div class="quiz-item ${ok === true ? 'right' : ok === false ? 'wrong' : ''}"><div class="qt">${esc(it.t)}</div>
        <select data-c="sumAns" data-k="${k}" aria-label="${esc(it.t)}" ${st.checked ? 'disabled' : ''}><option value="">בחירה…</option>${(it.fixed ? it.o.map((x, i) => ({x, i})) : shuffled(it.o, it.t)).map(({x, i}) => `<option value="${i}" ${String(v) === String(i) ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>
        ${ok === false ? `<div class="fx">התשובה: ${esc(it.o[it.a])}</div>` : ''}</div>`;
      }).join('')}
      <div class="row">${st.checked ? `<b style="color:var(--tr-accent)">${Q.items.filter((it, k) => +st.ans[k] === it.a).length}/${Q.items.length} נכונות</b><button class="trb ghost" data-a="sumRetry">שוב</button>` : `<button class="trb" data-a="sumCheck">בדיקה</button>`}<button class="trb ghost" data-a="hsClose">סגירה</button></div>`;
  },
  check() {
    const st = S.ui.hs, Q = SUMMARY[st.summary];

    const score = Q.items.filter((it, k) => +st.ans[k] === it.a).length;
    const prev = S.progress.quizzes[st.summary];
    if (prev === undefined) Trainer.addPoints(score * 3);

};

/* ---------- phone ---------- */
const Phone = {
  recip(m) { const c = consentOf(m.consentId); return c && c.recipients.find(r => r.id === m.recipientId); },
  unread() { return S.phone.filter(m => { const r = this.recip(m); return m.delivered && !m.read && r && !r.signed && consentState(consentOf(m.consentId)) === 'pending'; }).length; },
  render() {
    const el = $('#phone'), ph = S.ui.phone;

    el.hidden = false;
    let body;
    if (ph.view === 'sign') body = this.signView();
    else {
      const msgs = S.phone.slice().reverse();

        const c = consentOf(m.consentId), r = this.recip(m); if (!c || !r) return '';
        const s = stu(c.studentId), st = consentState(c);

        const from = m.kind === 'wa' ? `וואטסאפ · ממך` : `פורטל הורים (סימולציה)`;
        const action = r.signed ? `<div class="sm" style="color:#1f7a43;margin-top:6px">✓ נחתם</div>` : st !== 'pending' ? `<div class="sm muted" style="margin-top:6px">הבקשה כבר לא בתוקף</div>` : !m.delivered ? `<div class="unread">${esc(r.name.split(' ')[0])} עוד לא ראה את ההודעה (הוא בסופר). אולי תזכורת תעזור?</div>` : `<button class="phb" data-a="phSign" data-id="${m.id}">לחתימה</button>`;
        return `<div class="sms ${m.kind === 'wa' ? 'wa' : ''}"><div class="from"><span>${from}</span><span>אל: ${esc(r.name)}</span></div>${txt}${action}</div>`;
      }).join('') : `<p class="muted">אין הודעות. כששולחים הסכמה מדעת בפורטל, ההודעה להורים מגיעה לכאן.</p>`}`;
    }
    el.innerHTML = `<div class="ph-top"><span>הטלפון של ההורים · סימולציה</span><button data-a="phoneToggle" aria-label="סגירת הטלפון">${I.x}</button></div><div class="ph-screen">${body}</div>`;
    if (ph.view === 'sign' && ph.step === 'form') this.bindPad();
  },
  signView() {
    const ph = S.ui.phone, m = S.phone.find(x => x.id === ph.msgId), c = consentOf(m.consentId), r = this.recip(m), s = stu(c.studentId);
    if (ph.step !== 'form') return `<div class="portal"><h4>פורטל הורים</h4><p>שלום ${esc(r.name)}.</p><div class="form"><b>הזדהות</b><br>כאן ההורה עובר הזדהות לאומית (פעם אחת, אחר כך זה קל יותר). בסימולטור מדלגים. בעולם האמיתי, זה הרגע שבו ההורה מתקשר אליכם.</div>
      <div class="row"><button class="phb" data-a="phStep">המשך (הזדהות מדומה)</button><button class="phb alt" data-a="phBack">חזרה</button></div></div>`;
    return `<div class="portal"><h4>חתימה על הסכמה מדעת</h4><div class="form">${consentFormHtml(s, c).replace('<h3>טופס הסכמה מדעת</h3>', '')}</div>
      <label class="chk" style="font-size:13px;margin-bottom:8px"><input type="checkbox" id="phHist"> אני מסכים/ה שמידע קודם מהשפ"ח (תיקי נייר) יועלה למערכת</label>
      <div class="sm muted">חתמו כאן באצבע או בעכבר:</div><canvas class="sigpad" id="sigpad" width="290" height="110" aria-label="משטח חתימה"></canvas>
      <div class="row" style="margin-top:8px"><button class="phb" id="phSignBtn" data-a="phDoSign" disabled>חתימה ושליחה</button><button class="phb alt" data-a="phBack">חזרה</button></div></div>`;
  },
  bindPad() {
    const cv = $('#sigpad'); if (!cv) return;
    const ctx = cv.getContext('2d'); ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.strokeStyle = '#1d3b5c';
    let down = false, len = 0, last = null;
    const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
    cv.onpointerdown = e => { down = true; last = pt(e); cv.setPointerCapture(e.pointerId); };
    cv.onpointermove = e => { if (!down) return; const p = pt(e); ctx.beginPath(); ctx.moveTo(...last); ctx.lineTo(...p); ctx.stroke(); len += Math.hypot(p[0] - last[0], p[1] - last[1]); last = p; if (len > 40) $('#phSignBtn').disabled = false; };
    cv.onpointerup = () => { down = false; };
  }
};

/* ---------- trainer ---------- */
const Trainer = {
  prog(id) { return S.progress.m[id] || (S.progress.m[id] = {cur: 0, steps: {}, wrong: {}, done: false, hint: false, nudged: {}}); },
  addPoints(n) { S.progress.points += n; },
  sin(text) { S.progress.sins.push({text, m: S.progress.active, at: new Date().toLocaleTimeString('he-IL', {hour: '2-digit', minute: '2-digit'})}); toast(`נרשם ב"רשימת החטאים" (בחלונית "התקדמות")`, 'tr'); persist(); },
  start(id) {
    const M = MISSIONS.find(x => x.id === id);
    S.progress.m[id] = {cur: 0, steps: {}, wrong: {}, done: false, hint: false, nudged: {}};
    S.progress.active = id;
    S.ui.drawer.open = true; S.ui.drawer.tab = 'missions';
    M.setup && M.setup();
    M.start && M.start();
    this.renderDrawer(); this.syncBody(); persist();
    coach({who: `משימה ${MISSIONS.indexOf(M) + 1}${M.bonus ? ' (בונוס)' : ''} · ${M.time}`, title: M.title, body: `<div class="story" style="background:var(--surface-2);color:var(--ink)">${M.story}</div><p>הצעדים מחכים לכם בחלונית הכהה בצד. כל צעד מסומן אוטומטית כשתבצעו אותו.</p>`, actions: [{label: `יאללה`}]});
    this.checkState();
  },
  complete(M, P, idx, how) {
    if (P.steps[idx] || idx >= M.steps.length) return;
    P.steps[idx] = how;
    if (how === 'done') this.addPoints(10);
    P.cur = 0;
    while (P.steps[P.cur]) P.cur++;
    P.hint = false;
    if (P.cur >= M.steps.length && !P.done) this.finish(M, P);
  },
  finish(M, P) {
    P.done = true;
    const idx = MISSIONS.indexOf(M), next = MISSIONS.slice(idx + 1).find(x => !this.prog(x.id).done) || MISSIONS.find(x => !this.prog(x.id).done);
    const sins = S.progress.sins.filter(s => s.m === M.id);
    setTimeout(() => coach({who: `משימה הושלמה`, title: `${M.title} ✓`, body: `<p><b>השורה התחתונה:</b> ${M.lesson}</p>${sins.length ? `<p class="muted sm">רשמנו ${sins.length} "חטאים" במשימה הזאת. לא נורא, בשביל זה יש סימולטור.</p>` : ''}<p>יש לכם <b>${S.progress.points}</b> נקודות.</p>`,
      actions: next ? [{label: `למשימה הבאה: ${next.title}`, fn: () => this.start(next.id)}, {label: `להישאר כאן`, cls: 'btn-ghost'}] : [{label: `לתעודה!`, fn: () => this.certificate()}]}), 500);
  },
  onEvent(type, d) {
    const id = S.progress.active; if (!id) return;
    const M = MISSIONS.find(x => x.id === id), P = this.prog(id);
    if (P.done) return;
    const before = Object.keys(P.steps).length;
    M.onAny && M.onAny(type, d, P, M);
    let adv = Object.keys(P.steps).length !== before;
    // null = this event is not what the step waits for; false = it is, but the check failed.
    const hits = st => {
      if (![].concat(st.ev || []).includes(type)) return null;
      try { return !!(!st.test || st.test(d)); } catch (e) { return false; }
    };
    while (P.cur < M.steps.length) {
      const st = M.steps[P.cur];
      if (st.quiz || hits(st) !== true) break;
      this.complete(M, P, P.cur, 'done'); adv = true;
    }
    // Credit a step the trainee did out of order. Without this the event is
    // lost, and the step stays open even though the work is done.
    for (let k = P.cur + 1; k < M.steps.length; k++) {
      const st = M.steps[k];
      if (P.steps[k] || st.quiz) continue;
      if (hits(st) === true) { this.complete(M, P, k, 'done'); adv = true; }
    }
    // The action was right but the check did not pass: say so once, and open
    // the hint, instead of leaving the trainee wondering what was missed.
    if (!adv && P.cur < M.steps.length && type !== 'consent.form') {
      const st = M.steps[P.cur];
      P.nudged = P.nudged || {};
      if (!st.quiz && hits(st) === false && !P.nudged[P.cur]) {
        P.nudged[P.cur] = true;
        if (st.hint) P.hint = true;
        toast(`הפעולה נרשמה, אבל הצעד עדיין לא הושלם.${st.hint ? ` ראו את הרמז.` : ''}`, 'tr');
        this.renderDrawer(); persist();
      }
    }
    if (adv) { toast(`✓ צעד הושלם`, 'tr'); this.renderDrawer(); this.renderStrip(); persist(); }
  },
  checkState() {},
  answer(i) {
    const M = MISSIONS.find(x => x.id === S.progress.active), P = this.prog(M.id), st = M.steps[P.cur];
    if (!st || !st.quiz) return;
    if (i === 0) {
      P.lastEx = {idx: P.cur, ex: st.quiz.ex};
      const tries = (P.wrong[P.cur] || []).length;
      P.steps[P.cur] = 'done'; this.addPoints(tries ? 5 : 10);
      P.cur = 0; while (P.steps[P.cur]) P.cur++;
      P.hint = false;
      if (P.cur >= M.steps.length) this.finish(M, P);
    } else { (P.wrong[P.cur] = P.wrong[P.cur] || []).push(i); }
    persist(); this.renderDrawer(); this.renderStrip();
  },
  syncBody() { document.body.classList.toggle('dopen', !!S.ui.drawer.open); },
  renderStrip() {
    const done = MISSIONS.filter(m => !m.bonus && this.prog(m.id).done).length, core = MISSIONS.filter(m => !m.bonus).length;
    const un = Phone.unread();
    $('#tr-strip').innerHTML = `<div class="wrap"><span class="tr-tag">סימולטור</span><span class="tr-note">כל הנתונים בדויים · שום דבר לא נשלח לאף אחד</span><span class="tr-sp"></span>
      <button class="tr-btn" data-a="trOpen" data-t="missions" aria-pressed="${S.ui.drawer.open && S.ui.drawer.tab === 'missions'}">${I.target} משימות ${done}/${core}</button>
      <button class="tr-btn" data-a="exploreToggle" aria-pressed="${!!S.progress.exploreOn}">${I.eye} מה אני?</button>
      <button class="tr-btn" data-a="phoneToggle" aria-pressed="${!!S.ui.phone.open}">${I.phone} טלפון ההורה${un ? ` <span class="badge">${un}</span>` : ''}</button>
      <button class="tr-btn" data-a="trOpen" data-t="progress">${S.progress.points} נק'</button></div>`;
  },
  renderDrawer() {
    const dr = $('#drawer'), o = S.ui.drawer;
    dr.classList.toggle('open', !!o.open);
    dr.setAttribute('aria-hidden', o.open ? 'false' : 'true');
    if (!o.open) { dr.innerHTML = ''; return; }
    const tab = o.tab;
    let body = '';
    if (tab === 'missions') body = this.missionsTab();
    else if (tab === 'explore') body = this.exploreTab();
    else body = this.progressTab();
    dr.innerHTML = `<div class="dr-h"><h2>חדר הכושר של שחפים</h2><button class="dr-x" data-a="trClose" aria-label="סגירת החלונית">${I.x}</button></div>
      <div class="dr-tabs">${[['missions', `משימות`], ['explore', `סיור "מה אני?"`], ['progress', `התקדמות`]].map(([k, l]) => `<button class="${tab === k ? 'on' : ''}" data-a="trTab" data-t="${k}">${l}</button>`).join('')}</div>
      <div class="dr-body">${body}</div>`;
  },
  missionsTab() {
    const id = S.progress.active, M = id && MISSIONS.find(x => x.id === id);
    let out = '';
    if (M) {
      const P = this.prog(id);
      out += `<div class="mcard active"><h4>${esc(M.title)}</h4><div class="meta">${M.time}${M.bonus ? ' · בונוס' : ''}${P.done ? ' · הושלמה ✓' : ''}</div><div class="story">${M.story}</div>
        <ol class="steps">${M.steps.map((st, k) => {
          const stt = P.steps[k], cur = k === P.cur && !P.done;
          const text = st.quiz ? `<b>שאלה:</b> ${esc(st.quiz.q)}` : st.t;
          let extra = '';
          if (cur && st.quiz) extra = `<div class="qz">${shuffled(st.quiz.o, st.quiz.q).map(({x, i}) => `<button class="${(P.wrong[k] || []).includes(i) ? 'wrong' : ''}" data-a="trAnswer" data-i="${i}">${esc(x)}</button>`).join('')}</div>`;
          if (cur && !st.quiz && st.hint) extra = P.hint ? `<div class="hintbox">${st.hint}</div>` : `<button class="trb ghost" style="margin-top:6px" data-a="trHint">רמז</button>`;
          if (P.lastEx && P.lastEx.idx === k) extra += `<div class="hintbox" style="border-style:solid;border-color:#2b9a52;background:#1d3326;color:#cdeed8">${esc(P.lastEx.ex)}</div>`;
          return `<li class="${stt === 'done' ? 'done' : stt === 'skip' ? 'skip' : cur ? 'cur' : ''}"><span class="dot">${stt === 'done' ? '✓' : stt === 'skip' ? '–' : k + 1}</span><div>${text}${extra}</div></li>`;
        }).join('')}</ol>
        <div class="row" style="margin-top:10px">${P.done ? '' : `<button class="trb ghost" data-a="trSkip">דילוג על הצעד</button>`}<button class="trb ghost" data-a="trStart" data-id="${id}">התחלה מחדש</button><button class="trb ghost" data-a="trQuit">יציאה מהמשימה</button></div></div>`;
    } else out += `<p>בחרו משימה. כל משימה היא סיפור קצר מהשטח, והצעדים מסומנים אוטומטית כשתבצעו אותם במערכת. אפשר לעשות אותן לפי הסדר, או לקפוץ.</p>`;
    out += `<h4 style="margin:14px 0 8px;color:var(--tr-muted);font-weight:500">כל המשימות</h4>` + MISSIONS.map((m, k) => {
      const P = this.prog(m.id), n = Object.keys(P.steps).length;
      return `<div class="mcard ${P.done ? 'done' : ''} ${m.id === id ? 'active' : ''}"><h4>${k + 1}. ${esc(m.title)}</h4><div class="meta">${m.time}${n && !P.done ? ` · ${n}/${m.steps.length} צעדים` : ''}</div>
        ${m.id !== id ? `<div style="margin-top:8px"><button class="trb ${P.done ? 'ghost' : ''}" data-a="trStart" data-id="${m.id}">${P.done ? 'שוב' : n ? 'המשך מההתחלה' : 'התחלה'}</button></div>` : ''}</div>`;
    }).join('');
    return out;
  },
  exploreTab() {
    return `<button class="sw" data-a="exploreToggle" aria-pressed="${!!S.progress.exploreOn}"><i></i><span>${S.progress.exploreOn ? 'הנקודות מוצגות על המסך' : 'הצגת נקודות "מה אני?" על המסך'}</span></button>
      <p>בכל מסך מסתתרות נקודות צהובות. לחצו על נקודה, נחשו מה הרכיב עושה, וקבלו הסבר מהמדריך. בסוף כל מסך יש תרגיל סיכום.</p>` +
      Object.entries(SCREENS).map(([k, sc]) => {
        const ids = Explore.ids(k), f = ids.filter(x => S.progress.found[x]).length, q = S.progress.quizzes[k];
        return `<div class="mcard"><h4>${sc.label}</h4><div class="prog"><i style="width:${f / ids.length * 100}%"></i></div><div class="meta">${f}/${ids.length} נקודות${q !== undefined ? ` · סיכום: ${q}/${SUMMARY[k].items.length}` : ''}</div>${sc.note ? `<div class="meta" style="margin-top:4px">${sc.note}</div>` : ''}
          <div class="row" style="margin-top:8px"><button class="trb" data-a="exploreGo" data-s="${k}">קחו אותי לשם</button><button class="trb ghost" data-a="sumOpen" data-s="${k}">תרגיל סיכום</button></div></div>`;
      }).join('');
  },
  progressTab() {
    const core = MISSIONS.filter(m => !m.bonus), done = core.filter(m => this.prog(m.id).done).length, bonus = MISSIONS.filter(m => m.bonus && this.prog(m.id).done).length;
    const hsTotal = Object.keys(HS).length, hsFound = Object.keys(S.progress.found).length;
    return `<div class="stat3"><div><b>${S.progress.points}</b><span>נקודות</span></div><div><b>${done}/${core.length}</b><span>משימות${bonus ? ` (+${bonus} בונוס)` : ''}</span></div><div><b>${hsFound}/${hsTotal}</b><span>נקודות "מה אני?"</span></div></div>
      <div class="mcard"><h4>רשימת החטאים</h4>${S.progress.sins.length ? `<ol class="sins">${S.progress.sins.map(s => `<li>${esc(s.text)} <span style="color:var(--tr-muted)">(${s.at})</span></li>`).join('')}</ol>` : `<div class="meta">ריקה. ממש מחשיד.</div>`}</div>
      <div class="mcard"><h4>תעודה</h4><div class="meta">${done >= core.length ? 'השלמתם את כל המשימות. מגיע לכם.' : `השלימו את ${core.length} משימות הליבה כדי לקבל תעודה (עוד ${core.length - done}).`}</div><div style="margin-top:8px"><button class="trb" data-a="trCert" ${done >= core.length ? '' : 'disabled style="opacity:.4"'}>הפקת תעודה</button></div></div>
      <div class="mcard"><h4>השם שלכם במערכת</h4><form class="row" data-a-submit="trName"><input class="inp" name="nm" value="${esc(S.user.name)}" style="background:#1b1f2a;color:var(--tr-ink);border-color:var(--tr-line);flex:1" aria-label="שם"><button class="trb" type="submit">עדכון</button></form></div>
      <div class="mcard"><h4>איפוס</h4><div class="meta">מוחק את כל מה שעשיתם ומתחיל מחדש. (למנחה: שימושי בין קבוצות.)</div><div style="margin-top:8px"><button class="trb ghost" data-a="trReset">איפוס מלא</button></div></div>`;
  },
  certificate() {
    const done = MISSIONS.filter(m => this.prog(m.id).done).length;
    coach({who: '', title: '', size: 'md', body: `<div class="cert"><div class="muted sm">שפ"ח חוף השחפים · סביבת התרגול</div><h2>תעודת גלישה בטוחה בשחפים</h2><p>מוענקת בזאת ל</p><div class="nm">${esc(S.user.name)}</div>
      <p>שהשלים/ה ${done} משימות, מצא/ה ${Object.keys(S.progress.found).length} רכיבים במסכים וצבר/ה ${S.progress.points} נקודות,<br>ונמצא/ה כשיר/ה לתעד, לשמור, ולא לשכוח לסגור מפגש.</p>
      <p class="tnum">${fmt(TODAY)}</p><div class="fine">התעודה אינה מקנה גמול השתלמות, אינה ניתנת להמרה ואינה מוכרת על ידי אף גוף. לתעודה רשמית: בתוספת תשלום, ראו את המנחה. צלמו מסך ושתפו בקבוצה.</div><div class="fine">${CREDIT}</div></div>`, actions: [{label: `סגירה`}]});
  }
};

/* ---------- trainer actions ---------- */
A.trOpen = el => { const o = S.ui.drawer; if (o.open && o.tab === el.dataset.t) o.open = false; else { o.open = true; o.tab = el.dataset.t; } Trainer.syncBody(); Trainer.renderDrawer(); Trainer.renderStrip(); persist(); setTimeout(() => Explore.position(), 260); };
A.trClose = () => { S.ui.drawer.open = false; Trainer.syncBody(); Trainer.renderDrawer(); Trainer.renderStrip(); persist(); setTimeout(() => Explore.position(), 260); };
A.trTab = el => { S.ui.drawer.tab = el.dataset.t; Trainer.renderDrawer(); Trainer.renderStrip(); };
A.trStart = el => Trainer.start(el.dataset.id);
A.trQuit = () => { S.progress.active = null; Trainer.renderDrawer(); persist(); };
A.trHint = () => { Trainer.prog(S.progress.active).hint = true; Trainer.renderDrawer(); };
A.trSkip = () => { const M = MISSIONS.find(x => x.id === S.progress.active), P = Trainer.prog(M.id); Trainer.complete(M, P, P.cur, 'skip'); Trainer.renderDrawer(); persist(); };
A.trAnswer = el => Trainer.answer(+el.dataset.i);
A.trCert = () => Trainer.certificate();
A.trName = form => { const v = readForm(form).nm; if (v) { S.user.name = v; render(); toast(`השם עודכן`, 'tr'); } };
A.trReset = () => coach({title: `איפוס מלא?`, body: `<p>כל הנתונים, המשימות והנקודות יימחקו, והסימולטור יחזור למצב ההתחלה.</p>`, actions: [{label: `איפוס`, cls: 'btn-red', fn: () => { const name = S.user.name; S = seed(); S.user.name = name; S.user.onboarded = true; persist(); render(); toast(`הסימולטור אופס.`, 'tr'); }}, {label: `ביטול`, cls: 'btn-ghost'}]});
A.exploreToggle = () => { S.progress.exploreOn = !S.progress.exploreOn; if (!S.progress.exploreOn) { S.ui.hs = null; Explore.renderCard(); } else { S.ui.drawer.open = true; S.ui.drawer.tab = 'explore'; Trainer.syncBody(); } persist(); Trainer.renderStrip(); Trainer.renderDrawer(); setTimeout(() => Explore.refresh(), 260); if (S.progress.exploreOn) toast(`חפשו את הנקודות הצהובות על המסך`, 'tr'); };
A.exploreGo = el => { if (!S.progress.exploreOn) { S.progress.exploreOn = true; Trainer.renderStrip(); Trainer.renderDrawer(); } SCREENS[el.dataset.s].go(); setTimeout(() => Explore.refresh(), 300); };
A.sumOpen = el => Explore.openSummary(el.dataset.s);
A.sumCheck = () => Explore.check();
A.sumRetry = () => { S.ui.hs.checked = false; S.ui.hs.ans = {}; Explore.renderCard(); };
C.sumAns = el => { S.ui.hs.ans[el.dataset.k] = el.value; };
A.hsOpen = el => Explore.open(el.dataset.hsId);
A.hsPick = el => Explore.pick(+el.dataset.i);
A.hsNext = () => Explore.next();
A.hsClose = () => { S.ui.hs = null; Explore.renderCard(); };
A.phoneToggle = () => { S.ui.phone.open = !S.ui.phone.open; S.ui.phone.view = 'list'; Phone.render(); Trainer.renderStrip(); persist(); if (S.ui.phone.open) emit('phone.opened'); };
A.phSign = el => { const m = S.phone.find(x => x.id === el.dataset.id); m.read = true; S.ui.phone = {open: true, view: 'sign', msgId: m.id, step: 'id'}; Phone.render(); Trainer.renderStrip(); };
A.phStep = () => { S.ui.phone.step = 'form'; Phone.render(); };
A.phBack = () => { S.ui.phone.view = 'list'; Phone.render(); };
A.phDoSign = () => {
  const m = S.phone.find(x => x.id === S.ui.phone.msgId), c = consentOf(m.consentId), r = Phone.recip(m);
  const hist = !!($('#phHist') || {}).checked;
  S.ui.phone.view = 'list';
  signRecipient(c, r, hist);
  Phone.render(); Trainer.renderStrip();
};

function showSystemMessages(relogin, after) {
  coach({who: `הודעות מערכת`, title: relogin ? `התחברתם מחדש (בדמיון)` : `עדכונים ופיתוחים חדשים`, body: `<ul style="padding-inline-start:18px;line-height:1.7;margin:0">
    <li>ברוכים הבאים לגרסת הסימולטור של שחפים. כאן מותר לטעות. במערכת האמיתית גם מותר, אבל זה נרשם באודיט.</li>
    <li>המערכת תושבת הלילה בין 02:00 ל-04:00 לצורך עדכון. אם אתם מתעדים בשעות האלה, צריך לדבר.</li>
    <li>חדש! "תיק תלמיד" הוא מעכשיו "גליון תלמיד". מי שאומר "תיק" בישיבת צוות מביא עוגה.</li>
    <li>תזכורת: "אישור" מאשר. "שמירה" שומרת. זה לא אותו דבר. (באמת. זה כתוב במדריך.)</li></ul>`, actions: [{label: `כניסה למערכת`, fn: after}]});
}
function onboarding() {
  coach({who: `סביבת תרגול`, title: `ברוכים הבאים לסימולטור שחפים`, body: `<p>זה העתק לתרגול של מערכת שחפים, בנוי לפי המדריך למשתמש. כל התלמידים, ההורים והמסגרות בדויים, ושום דבר לא נשלח לשום מקום.</p>
    <p><b>שתי דרכים לתרגל:</b></p><ul style="padding-inline-start:18px;margin-top:0"><li><b>מה אני?</b> נקודות צהובות על המסך. לוחצים ומנחשים מה כל רכיב עושה.</li><li><b>משימות.</b> סיפורים קצרים מהשטח, מהפנייה הראשונה ועד סגירת מפגש. הצעדים מסומנים לבד.</li></ul>
    <p class="muted sm">${CREDIT}</p>
    <div class="fld"><label for="obName">איך לקרוא לכם במערכת?</label><input class="inp" id="obName" placeholder="למשל: רעות גירד" autocomplete="off"></div>`,
    actions: [{label: `להתחיל במשימות`, fn: (v) => obDone('missions', v)}, {label: `להתחיל בסיור "מה אני?"`, cls: '', fn: (v) => obDone('explore', v)}]});
}
function obDone(mode, vals) {
  const v = ((vals && vals.obName) || '').trim();
  if (v) S.user.name = v;
  S.user.onboarded = true;
  render();
  showSystemMessages(false, () => {
    if (mode === 'missions') Trainer.start('m1');
    else { S.progress.exploreOn = true; S.ui.drawer = {open: true, tab: 'explore'}; Trainer.syncBody(); render(); toast(`חפשו את הנקודות הצהובות על המסך`, 'tr'); }
  });
}

/* ================= boot & delegation ================= */
function boot() {
  document.documentElement.lang = 'he';
  document.documentElement.dir = 'rtl';
  S = loadState() || seed();
  S.interventions = S.interventions.filter(i => !i.unsaved);
  Object.assign(S.ui, {modal: null, hs: null, pageDraft: null, dirty: false});
  if (S.ui.phone) S.ui.phone.view = 'list';
  Trainer.syncBody();
  render();
  if (!S.user.onboarded) onboarding();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.tagName === 'INPUT' || el.tagName === 'SELECT') return;
  const fn = A[el.dataset.a];
  if (!fn) return;
  e.preventDefault();
  try { fn(el, e); } catch (err) { console.error(err); toast(`משהו השתבש. נסו שוב.`); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, fn = A[f.dataset.aSubmit];
  if (fn) { try { fn(f); } catch (err) { console.error(err); } }
});
function consentFormEvent(el) {
  const m = S.ui.modal;
  if (!m || m.name !== 'consent' || !el.closest('#modal-root')) return;
  const root = modalRoot();
  emit('consent.form', {sid: m.props.id, f: readForm(root), recips: readRecips(root, m.props.recips)});
}
document.addEventListener('change', e => {
  const el = e.target;
  applyDeps(document);
  consentFormEvent(el);
  if (el.name === 'famfill') C.famFill(el);
  if (el.dataset.c && C[el.dataset.c]) C[el.dataset.c](el);
  if (el.dataset.cAll) { const tb = el.closest('table'); $$(`[name="${el.dataset.cAll}"]`, tb).forEach(x => { x.checked = el.checked; }); }
  if (el.closest('[data-form="intv"]')) S.ui.dirty = true;
  Explore.position();
});
document.addEventListener('input', e => {
  if (e.target.closest('[data-form="intv"]')) S.ui.dirty = true;
  if (e.target.type === 'tel' || e.target.type === 'email') consentFormEvent(e.target);
});
let rafPending = false;
const repos = () => { if (rafPending) return; rafPending = true; requestAnimationFrame(() => { rafPending = false; Explore.position(); }); };
window.addEventListener('scroll', repos, true);
window.addEventListener('resize', repos);
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#coach-root').innerHTML) { closeCoach(); return; }
  if (S.ui.hs) { S.ui.hs = null; Explore.renderCard(); return; }
  if (S.ui.modal) closeModal();
});
boot();
window.__sim = {state: () => S};

})();
</script>
</body></html>
